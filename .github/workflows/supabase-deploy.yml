name: Deploy Repair Pro Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Backend
        run: |
          unzip -q Repair-Pro-3.0-GitHub-Build.zip 'supabase/*' -d backend
          test -f backend/supabase/functions/repair-pro-api/index.ts

      - name: Setup Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy API
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy repair-pro-api \
            --remote=xuakzzjtcgcvudkgxpbd \
            --yes

      - name: Verify Deployment
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list \
            --remote=xuakzzjtcgcvudkgxpbd
