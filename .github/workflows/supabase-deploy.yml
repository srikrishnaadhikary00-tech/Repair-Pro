name: Deploy Repair Pro Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Backend
        run: |
          unzip -q Repair-Pro-3.0-GitHub-Build.zip 'supabase/*' -d backend
          test -f backend/supabase/functions/repair-pro-api/index.ts

      - name: Fix Netlify CORS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("backend/supabase/functions/_shared/firebase-auth.ts")
          s = p.read_text()
          origin = "https://incandescent-churros-f9b269.netlify.app"
          marker = "const ALLOWED_ORIGINS = new Set(["
          assert marker in s
          if origin not in s:
              s = s.replace(marker, marker + '\n  "' + origin + '",', 1)
          p.write_text(s)
          PY

      - name: Setup Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy API
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-push-notification --no-verify-jwt \
            --remote=xuakzzjtcgcvudkgxpbd \
            --yes

      - name: Verify Deployment
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list \
            --remote=xuakzzjtcgcvudkgxpbd
