
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Repair Pro
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          while IFS= read -r -d '' file; do
            echo "Extracting $file"
            unzip -oq "$file" -d extracted
          done < <(find . -maxdepth 3 -type f -iname '*.zip' -print0)

          PROJECT=""

          while IFS= read -r -d '' file; do
            DIR="$(dirname "$file")"
            if [ -d "$DIR/app" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find extracted . \
              -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path './.git/*' \
              -print0
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          PROJECT="$(cd "$PROJECT" && pwd)"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Debug Keystore
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Check Release Signing Secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REPAIR_PRO_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$STORE_PASSWORD" ] &&
             [ -n "$KEY_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets missing"
          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks

      - name: Build Signed Release AAB
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REPAIR_PRO_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon bundleRelease
          else
            gradle --no-daemon bundleRelease
          fi

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Release-AAB
          path: |
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
