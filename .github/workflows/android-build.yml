
name: Build Repair Pro APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Repair Pro 2.x
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android Project
        id: project
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          target = root / "_android_source"

          def find_project(base):
              for f in sorted(base.rglob("settings.gradle*")):
                  if f.name not in (
                      "settings.gradle",
                      "settings.gradle.kts"
                  ):
                      continue
                  p = f.parent
                  if (
                      (p / "app/build.gradle").exists()
                      or (p / "app/build.gradle.kts").exists()
                  ):
                      return p.resolve()
              return None

          project = find_project(root)

          if project is None:
              target.mkdir(exist_ok=True)

              for i, archive in enumerate(
                  sorted(root.rglob("*.zip"))
              ):
                  if target in archive.parents:
                      continue

                  dest = target / str(i)
                  dest.mkdir(parents=True, exist_ok=True)

                  try:
                      with zipfile.ZipFile(archive) as z:
                          for member in z.infolist():
                              path = (
                                  dest / member.filename
                              ).resolve()

                              if not path.is_relative_to(
                                  dest.resolve()
                              ):
                                  raise ValueError(
                                      "Unsafe ZIP path"
                                  )

                          z.extractall(dest)

                  except Exception as e:
                      print("Archive skipped:", e)
                      continue

                  project = find_project(dest)

                  if project:
                      break

          if project is None:
              raise SystemExit(
                  "::error::Android project not found"
              )

          print("Android project:", project)

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as out:
              out.write(f"dir={project}\n")
          PY

      - name: Check Android SDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          echo "Android SDK ready"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          gradle --version
          echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

      - name: Automatic App Version
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          run = int(os.environ["RUN_NUMBER"])
          version = f"2.0.{run}"
          code = 200000 + run

          file = next(
              (
                  f for f in [
                      Path("app/build.gradle.kts"),
                      Path("app/build.gradle")
                  ]
                  if f.exists()
              ),
              None
          )

          if file is None:
              raise SystemExit("App Gradle file missing")

          content = file.read_text()
          kotlin = file.suffix == ".kts"

          code_pattern = r'\bversionCode\s*(?:=\s*)?\d+'
          name_pattern = (
              r'\bversionName\s*(?:=\s*)?'
              r'["\'][^"\']*["\']'
          )

          code_value = (
              f"versionCode = {code}"
              if kotlin else f"versionCode {code}"
          )

          name_value = (
              f'versionName = "{version}"'
              if kotlin else f'versionName "{version}"'
          )

          updated, c = re.subn(
              code_pattern, code_value, content, count=1
          )
          updated, n = re.subn(
              name_pattern, name_value, updated, count=1
          )

          if c and n:
              file.write_text(updated)
              print("Version:", version)
          else:
              print("Keeping existing version configuration")
          PY

      - name: Restore Firebase Configuration
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" \
              | base64 --decode \
              > app/google-services.json
          fi

          if [ -s app/google-services.json ]; then
            python3 -m json.tool \
              app/google-services.json > /dev/null
            echo "Firebase JSON valid"
          else
            echo "::warning::Firebase JSON missing"
          fi

      - name: Prepare Debug Keystore
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ -n "$DEBUG_KEY" ]; then
            printf '%s' "$DEBUG_KEY" \
              | base64 --decode \
              > "$HOME/.android/debug.keystore"
          fi

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          cp "$HOME/.android/debug.keystore" debug.keystore
          cp "$HOME/.android/debug.keystore" app/debug.keystore

          chmod 600 debug.keystore app/debug.keystore

      - name: Show Debug SHA Fingerprints
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'SHA1:|SHA256:'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          "$GRADLE_CMD" \
            --no-daemon \
            --max-workers=2 \
            :app:assembleDebug \
            --stacktrace \
            --no-configuration-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Release Signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE" ] && \
             [ -n "$STORE_PASS" ] && \
             [ -n "$KEY_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing unavailable"
          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE" \
            | base64 --decode \
            > my-upload-key.jks

          chmod 600 my-upload-key.jks

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload

      - name: Show Release SHA Fingerprints
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload \
            | grep -E 'SHA1:|SHA256:'

      - name: Build Release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ steps.project.outputs.dir }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -euo pipefail

          "$GRADLE_CMD" \
            --no-daemon \
            --max-workers=2 \
            :app:assembleRelease \
            :app:bundleRelease \
            --stacktrace \
            --no-configuration-cache

      - name: Verify Release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          test -n "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner \
            | sort -V | tail -1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Upload Release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Release-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Release-AAB
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Signing Files
        if: always() && steps.project.outputs.dir != ''
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -f my-upload-key.jks
          rm -f debug.keystore
          rm -f app/debug.keystore
          echo "Temporary signing files removed"

      - name: Build Summary
        if: success()
        run: |
          {
            echo "## Repair Pro Build"
            echo ""
            echo "Build completed successfully."
            echo ""
            echo "Download APK/AAB from Artifacts."
            echo ""
            echo "Check Firebase SHA fingerprints."
          } >> "$GITHUB_STEP_SUMMARY"
