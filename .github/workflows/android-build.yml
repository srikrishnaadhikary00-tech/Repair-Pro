
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q "Krishna--main.zip" -d extracted

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e
          FILE=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Build Release AAB
        continue-on-error: true
        shell: bash
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f gradlew ]; then
            ./gradlew --no-daemon bundleRelease
          else
            gradle --no-daemon bundleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-AAB-Unsigned
          path: extracted/**/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
