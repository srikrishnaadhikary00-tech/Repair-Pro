
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Repair Pro
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          unzip -q Krishna--main.zip -d extracted

          echo "Project extracted"

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=$(find extracted -type f \
            -name settings.gradle.kts -o \
            -name settings.gradle | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project: $PROJECT_DIR"

      - name: Restore Release Keystore
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > my-upload-key.jks

          test -s my-upload-key.jks

          echo "Keystore restored"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release AAB
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          REPAIR_PRO_STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          REPAIR_PRO_KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          REPAIR_PRO_KEY_ALIAS: ${{ secrets.REPAIR_PRO_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -s my-upload-key.jks

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon bundleRelease
          else
            gradle --no-daemon bundleRelease
          fi

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Release-AAB
          path: extracted/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
