
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "*.gradle.kts"
      - "*.gradle"
      - "*.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build Repair Pro 2.x
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            PROJECT=""
            mkdir -p extracted

            while IFS= read -r -d '' ZIP; do
              rm -rf extracted
              mkdir -p extracted

              unzip -oq "$ZIP" -d extracted

              SETTINGS="$(find extracted -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \) \
                -print -quit)"

              if [ -n "$SETTINGS" ]; then
                PROJECT="$(dirname "$SETTINGS")"
                break
              fi
            done < <(
              find . -maxdepth 1 -type f -iname '*.zip' -print0
            )

            if [ -z "$PROJECT" ]; then
              echo "::error::Android project not found"
              exit 1
            fi

            PROJECT="$(cd "$PROJECT" && pwd)"
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::App Gradle file missing"
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project ready: $PROJECT"

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK missing"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK ready"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Automatic App Version
        id: version
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_START_RUN: ${{ vars.VERSION_START_RUN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          run = int(os.environ["RUN_NUMBER"])
          start = int(os.environ.get("VERSION_START_RUN") or "1")

          patch = run - start

          if patch < 0:
              raise SystemExit(
                  "VERSION_START_RUN exceeds current run number"
              )

          version_name = f"2.0.{patch}"
          version_code = 200000 + run

          p = Path("app/build.gradle.kts")

          if not p.exists():
              p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("App Gradle file missing")

          source = p.read_text()

          kotlin = p.suffix == ".kts"

          if kotlin:
              code_value = (
                  'versionCode = '
                  'System.getenv("BUILD_VERSION_CODE")'
                  '?.toIntOrNull() ?: 2'
              )
              name_value = (
                  'versionName = '
                  'System.getenv("BUILD_VERSION_NAME")'
                  ' ?: "1.1.0"'
              )
          else:
              code_value = f"versionCode {version_code}"
              name_value = f'versionName "{version_name}"'

          code_pattern = (
              r'(?m)^([ \t]*)versionCode\s*(?:=\s*)?[^\n]+$'
          )
          name_pattern = (
              r'(?m)^([ \t]*)versionName\s*(?:=\s*)?[^\n]+$'
          )

          source, c = re.subn(
              code_pattern,
              lambda m: m.group(1) + code_value,
              source,
              count=1
          )

          source, n = re.subn(
              name_pattern,
              lambda m: m.group(1) + name_value,
              source,
              count=1
          )

          if c != 1 or n != 1:
              raise SystemExit(
                  "Version fields missing from Gradle file"
              )

          p.write_text(source)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"BUILD_VERSION_CODE={version_code}\n")
              f.write(f"BUILD_VERSION_NAME={version_name}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"name={version_name}\n")
              f.write(f"code={version_code}\n")

          print("Repair Pro App Version:", version_name)
          print("Version Code:", version_code)
          PY

      - name: Restore Firebase Configuration
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" \
              | base64 --decode > app/google-services.json
          fi

          if [ ! -s app/google-services.json ]; then
            echo "::error::Firebase JSON missing"
            exit 1
          fi

          python3 -m json.tool \
            app/google-services.json > /dev/null

          echo "Firebase ready"

      - name: Prepare Debug Keystore
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$DEBUG_KEY" ]; then
            printf '%s' "$DEBUG_KEY" \
              | base64 --decode > debug.keystore

          elif [ ! -s debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt

            echo "::warning::New debug signing key generated"
          fi

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey > /dev/null

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon \
              :app:assembleDebug \
              --stacktrace \
              --no-configuration-cache
          else
            echo "::error::Gradle wrapper missing"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-${{ steps.version.outputs.name }}-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Release Signing
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE" ] && \
             [ -n "$STORE_PASS" ] && \
             [ -n "$KEY_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets missing"
          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE" \
            | base64 --decode > my-upload-key.jks

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload > /dev/null

          keytool -certreq \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload \
            -keypass "$KEY_PASS" \
            -file /tmp/repair-pro-check.csr

          rm -f /tmp/repair-pro-check.csr

      - name: Build Release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ steps.project.outputs.dir }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease \
            --stacktrace \
            --no-configuration-cache

      - name: Upload Release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-${{ steps.version.outputs.name }}-Release-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-${{ steps.version.outputs.name }}-Release-AAB
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Signing Files
        if: always()
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -f my-upload-key.jks
