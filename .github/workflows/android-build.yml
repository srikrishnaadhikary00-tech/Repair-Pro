
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Repair Pro
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is missing"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 \
            -type f -name '*.zip' \
            -not -path './extracted/*' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          echo "Extracting $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Release Keystore
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing REPAIR_PRO_KEYSTORE_BASE64"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > my-upload-key.jks

          test -s my-upload-key.jks

          echo "Keystore restored successfully"

      - name: Verify Signing Secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REPAIR_PRO_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$STORE_PASSWORD" || {
            echo "Missing store password"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "Missing key password"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "Missing key alias"
            exit 1
          }

          echo "Signing secrets are present"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Signed Release AAB
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          REPAIR_PRO_STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          REPAIR_PRO_KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          REPAIR_PRO_KEY_ALIAS: ${{ secrets.REPAIR_PRO_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -s my-upload-key.jks

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon bundleRelease
          else
            gradle --no-daemon bundleRelease
          fi

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Release-AAB
          path: extracted/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
