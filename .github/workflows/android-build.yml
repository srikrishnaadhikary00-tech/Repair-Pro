
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "**/*.zip"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/*.kt"
      - "**/*.java"
      - "**/*.xml"

permissions:
  contents: read

concurrency:
  group: repair-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Repair Pro 2.x
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JAVA_VERSION: "17"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          if [ -f "Repair-Pro-v1.1-GitHub-Ready.zip" ]; then
            unzip -oq \
              "Repair-Pro-v1.1-GitHub-Ready.zip" \
              -d extracted
          fi

          SETTINGS="$(find . \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          PROJECT="$(cd "$PROJECT" && pwd)"

          if [ ! -f "$PROJECT/app/build.gradle" ] \
            && [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::App Gradle file missing"
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project found"

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "${ANDROID_HOME:?Android SDK missing}"

          echo "Android SDK ready"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ] \
            && [ -f gradle/wrapper/gradle-wrapper.jar ] \
            && [ -f gradle/wrapper/gradle-wrapper.properties ]; then

            chmod +x gradlew
            echo "Gradle wrapper ready"

          else
            echo "Gradle wrapper missing"
            echo "Using installed Gradle"
          fi

      - name: Automatic App Version
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          run = int(os.environ["RUN_NUMBER"])

          version_code = 200000 + run
          version_name = f"2.0.{run}"

          files = [
              Path("app/build.gradle.kts"),
              Path("app/build.gradle")
          ]

          file = next(
              (p for p in files if p.exists()),
              None
          )

          if file is None:
              raise SystemExit(
                  "App Gradle file missing"
              )

          text = file.read_text()

          kotlin = file.suffix == ".kts"

          code_pattern = (
              r"\bversionCode\s*(?:=\s*)?\d+"
          )

          name_pattern = (
              r'\bversionName\s*(?:=\s*)?'
              r'["\'][^"\']*["\']'
          )

          if kotlin:
              code_value = (
                  f"versionCode = {version_code}"
              )
              name_value = (
                  f'versionName = "{version_name}"'
              )
          else:
              code_value = (
                  f"versionCode {version_code}"
              )
              name_value = (
                  f'versionName "{version_name}"'
              )

          text, code_count = re.subn(
              code_pattern,
              code_value,
              text,
              count=1
          )

          text, name_count = re.subn(
              name_pattern,
              name_value,
              text,
              count=1
          )

          if not code_count or not name_count:
              raise SystemExit(
                  "Version fields not found. "
                  "Check app Gradle defaultConfig."
              )

          file.write_text(text)

          print("Version:", version_name)
          print("Version code:", version_code)
          PY

      - name: Restore Firebase Configuration
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" \
              | base64 --decode \
              > app/google-services.json
          fi

          if [ ! -s app/google-services.json ]; then
            echo "::error::Firebase JSON missing"
            exit 1
          fi

          python3 -m json.tool \
            app/google-services.json > /dev/null

          echo "Firebase configuration ready"

      - name: Prepare Debug Keystore
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$DEBUG_KEY" ]; then
            printf '%s' "$DEBUG_KEY" \
              | base64 --decode > debug.keystore
          fi

          if [ ! -s debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey > /dev/null

          echo "Debug keystore ready"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ] \
            && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew --no-daemon \
              :app:assembleDebug --stacktrace
          else
            gradle --no-daemon \
              :app:assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Debug-APK-${{ github.run_number }}
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Release Signing
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE" ] \
            && [ -n "$STORE_PASS" ] \
            && [ -n "$KEY_PASS" ]; then

            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured"

          else

            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release secrets missing"

          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE" \
            | base64 --decode \
            > my-upload-key.jks

          chmod 600 my-upload-key.jks

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload > /dev/null

          keytool -certreq \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload \
            -keypass "$KEY_PASS" \
            -file /tmp/repair-pro-check.csr

          rm -f /tmp/repair-pro-check.csr

          echo "Release keystore verified"

      - name: Show Release SHA Fingerprints
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "================================"
          echo "REPAIR PRO RELEASE CERTIFICATE"
          echo "================================"

          keytool -list -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload \
            | grep -E 'SHA1:|SHA256:'

          echo "================================"
          echo "Add these fingerprints to Firebase"
          echo "================================"

      - name: Build Release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ steps.project.outputs.dir }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -euo pipefail

          if [ -f gradlew ] \
            && [ -f gradle/wrapper/gradle-wrapper.jar ]; then

            ./gradlew --no-daemon \
              :app:assembleRelease \
              :app:bundleRelease \
              --stacktrace \
              --no-configuration-cache

          else

            gradle --no-daemon \
              :app:assembleRelease \
              :app:bundleRelease \
              --stacktrace \
              --no-configuration-cache

          fi

      - name: Verify Release APK Signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -name '*.apk' \
            -type f \
            -print -quit)"

          test -n "$APK" || {
            echo "::error::Release APK missing"
            exit 1
          }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort -V \
            | tail -1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "Release APK signature verified"

      - name: Upload Release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Release-APK-${{ github.run_number }}
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-Release-AAB-${{ github.run_number }}
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Signing Files
        if: always() && steps.project.outputs.dir != ''
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -f my-upload-key.jks
          rm -f debug.keystore
          echo "Temporary signing files cleaned"
