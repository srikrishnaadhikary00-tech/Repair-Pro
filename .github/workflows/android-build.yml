name: Build Repair Pro APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Repair Pro 3.x
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          target = root / "_android_source"

          def find_android(base):
              for name in (
                  "settings.gradle.kts",
                  "settings.gradle"
              ):
                  for f in sorted(base.rglob(name)):
                      p = f.parent
                      if (
                          (p / "app/build.gradle").exists()
                          or
                          (p / "app/build.gradle.kts").exists()
                      ):
                          return p.resolve()
              return None

          archive = root / "Repair-Pro-3.0-GitHub-Build.zip"
          if not archive.is_file():
              raise SystemExit("Expected Repair-Pro-3.0-GitHub-Build.zip in repository root")
          target.mkdir(exist_ok=False)
          with zipfile.ZipFile(archive) as z:
              for member in z.infolist():
                  if not (target / member.filename).resolve().is_relative_to(target.resolve()):
                      raise ValueError("Unsafe ZIP path")
              z.extractall(target)
          project = find_android(target)

          if project is None:
              raise SystemExit(
                  "::error::Android project not found"
              )

          print("Android project:", project)

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as out:
              out.write(f"dir={project}\n")
          PY

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          echo "Android SDK ready"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

      - name: Configure Supabase
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_ANON_KEY GitHub secret"
            exit 1
          fi
          printf '\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env
          echo "Supabase configuration ready"

      - name: Automatic App Version
        id: version
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          run = int(os.environ["RUN_NUMBER"])
          version = f"3.0.{run}"
          code = 300000 + run

          files = [
              Path("app/build.gradle.kts"),
              Path("app/build.gradle")
          ]

          file = next(
              (f for f in files if f.exists()),
              None
          )

          if file is None:
              raise SystemExit(
                  "Android app Gradle file missing"
              )

          content = file.read_text()
          kotlin = file.suffix == ".kts"

          code_pattern = (
              r'\bversionCode\s*(?:=\s*)?\d+'
          )

          name_pattern = (
              r'\bversionName\s*(?:=\s*)?'
              r'["\'][^"\']*["\']'
          )

          code_value = (
              f"versionCode = {code}"
              if kotlin else
              f"versionCode {code}"
          )

          name_value = (
              f'versionName = "{version}"'
              if kotlin else
              f'versionName "{version}"'
          )

          updated, c = re.subn(
              code_pattern,
              code_value,
              content,
              count=1
          )

          updated, n = re.subn(
              name_pattern,
              name_value,
              updated,
              count=1
          )

          if c and n:
              file.write_text(updated)
              print("Version updated:", version)
          else:
              raise SystemExit("Cannot update version fields")

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as out:
              out.write(f"name={version}\n")
          PY

      - name: Restore and Validate Firebase Configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" | base64 --decode > app/google-services.json
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Set GOOGLE_SERVICES_JSON_BASE64 or include the file in the project."
            exit 1
          fi
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          data = json.loads(Path('app/google-services.json').read_text())
          clients = data.get('client', [])
          if not clients:
              raise SystemExit('::error::Firebase JSON has no Android clients')
          for client in clients:
              info = client.get('client_info', {}).get('android_client_info', {})
              package = info.get('package_name', '')
              oauth = client.get('oauth_client', [])
              android = [c for c in oauth if c.get('client_type') == 1]
              web = [c for c in oauth if c.get('client_type') == 3]
              print(f'Firebase Android package: {package}')
              print(f'Android OAuth clients: {len(android)}; Web OAuth clients: {len(web)}')
              if not package:
                  raise SystemExit('::error::Missing Firebase Android package name')
              if not web:
                  print('::warning::No Web OAuth client in Firebase JSON; check Google Sign-In setup')
          print('Firebase JSON parsed successfully')
          PYCODE

      - name: Prepare Debug Keystore
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ -n "$DEBUG_KEY" ]; then
            printf '%s' "$DEBUG_KEY" \
              | base64 --decode \
              > "$HOME/.android/debug.keystore"
          fi

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          echo "Debug keystore ready"

      - name: Restore Project Debug Keystore
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          cp "$HOME/.android/debug.keystore" \
            debug.keystore

          cp "$HOME/.android/debug.keystore" \
            app/debug.keystore

          echo "Project debug keystore ready"

      - name: Show Debug SHA Fingerprints
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'SHA1:|SHA256:'

      - name: Check Release Signing
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE" ] && \
             [ -n "$STORE_PASS" ] && \
             [ -n "$KEY_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing unavailable"
          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE" \
            | base64 --decode \
            > my-upload-key.jks

          chmod 600 my-upload-key.jks

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload

          echo "Release keystore ready"

      - name: Show Release SHA Fingerprints
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload \
            | grep -E 'SHA1:|SHA256:'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          "$GRADLE_CMD" \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace \
            --no-configuration-cache \
            --no-build-cache \
            --no-parallel \
            --max-workers=1 \
            -Pksp.incremental=false

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Repair-Pro-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.project.outputs.dir }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -euo pipefail

          "$GRADLE_CMD" \
            --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease \
            --stacktrace \
            --no-configuration-cache \
            --no-build-cache \
            --no-parallel \
            --max-workers=1 \
            -Pksp.incremental=false

      - name: Verify Release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          test -n "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner \
            | sort -V | tail -1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "Release APK verified"

      - name: Verify Release AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(find app/build/outputs/bundle/release \
            -type f -name '*.aab' -print -quit)"

          if [ -z "$AAB" ]; then
            echo "::error::Release AAB not found"
            exit 1
          fi

          echo "Checking AAB signature..."

          jarsigner -verify \
            -verbose \
            -certs \
            "$AAB" \
            > aab-verification.log 2>&1 || {
              cat aab-verification.log
              echo "::error::AAB verification failed"
              exit 1
            }

          if grep -q "jar verified" aab-verification.log; then
            echo "AAB signature verification completed"
          else
            cat aab-verification.log
            echo "::error::AAB signature not verified"
            exit 1
          fi

          echo "Checking AAB structure..."

          python3 - "$AAB" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]

          with zipfile.ZipFile(path) as z:
              bad = z.testzip()

              if bad is not None:
                  raise SystemExit(
                      f"Corrupted AAB entry: {bad}"
                  )

              names = set(z.namelist())

              required = {
                  "BundleConfig.pb",
                  "base/manifest/AndroidManifest.xml"
              }

              missing = required - names

              if missing:
                  raise SystemExit(
                      f"Missing AAB entries: {missing}"
                  )

          print("AAB ZIP structure valid")
          PY

          echo "Release AAB verified"

      - name: Upload Release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: Repair-Pro-Release-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: Repair-Pro-Release-AAB
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Signing Files
        if: always() && steps.project.outputs.dir != ''
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          rm -f my-upload-key.jks
          rm -f debug.keystore
          rm -f app/debug.keystore
          rm -f aab-verification.log
          echo "Temporary signing files removed"

      - name: Build Summary
        if: success()
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          {
            echo "## Repair Pro 3.x Build"
            echo ""
            echo "Build completed successfully."
            echo ""
            echo "Version: $APP_VERSION"
            echo ""
            echo "Debug APK: Available"
            echo ""

            if [ "$SIGNING_READY" = "true" ]; then
              echo "Release APK: Available"
              echo "Release AAB: Available"
            else
              echo "Release signing not configured."
            fi

            echo ""
            echo "Download files from GitHub Artifacts."
            echo "Google Sign-In must also be tested on-device with the correct package, OAuth client and signing SHA fingerprints."
          } >> "$GITHUB_STEP_SUMMARY"
