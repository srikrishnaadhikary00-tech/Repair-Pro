
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          unzip -o "Krishna--main (1).zip" -d extracted
          find extracted -name settings.gradle.kts -o -name settings.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        
        with:
          accept-android-sdk-licenses: true

      - name: Build APK and AAB
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-AAB-Unsigned
          path: app/build/outputs/bundle/release/*.aab
