name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q "Krishna--main (1).zip" -d extracted
          find extracted -name settings.gradle.kts -o -name settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK and AAB
        shell: bash
        run: |
          set -e
          PROJECT_FILE=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew --no-daemon assembleDebug bundleRelease
          else
            gradle --no-daemon assembleDebug bundleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-AAB-Unsigned
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
