
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "Repair-Pro-v1.1-GitHub-Ready.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build Repair Pro v1.1
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Repair-Pro-v1.1-GitHub-Ready.zip"
          test -f "$ZIP" || {
            echo "::error::Project ZIP missing"
            exit 1
          }

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "::error::Android project missing"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"
          PROJECT="$(cd "$PROJECT" && pwd)"

          test -f "$PROJECT/app/build.gradle.kts" \
            || test -f "$PROJECT/app/build.gradle"

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:?Android SDK missing}"
          echo "Android SDK ready"

      - name: Restore Firebase Configuration
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" \
              | base64 --decode > app/google-services.json
          fi

          test -s app/google-services.json || {
            echo "::error::Firebase JSON missing"
            exit 1
          }

          python3 -m json.tool \
            app/google-services.json > /dev/null

          echo "Firebase ready"

      - name: Prepare Debug Keystore
        id: debug_key
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$DEBUG_KEY" ]; then
            printf '%s' "$DEBUG_KEY" \
              | base64 --decode > debug.keystore
            echo "existing=true" >> "$GITHUB_OUTPUT"

          elif [ -s debug.keystore ]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"

          else
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt

            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey > /dev/null

      - name: Verify Debug Certificate
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          EXISTING: ${{ steps.debug_key.outputs.existing }}
        run: |
          set -euo pipefail

          EXPECTED="07CF7BB92F7231A4D8D7728D2716F97C9B41ABD2"

          ACTUAL="$(keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | grep 'SHA1:' \
            | head -1 \
            | cut -d ':' -f 2- \
            | tr -d ' :\r\n' \
            | tr '[:lower:]' '[:upper:]')"

          echo "Debug SHA1: $ACTUAL"

          if [ "$EXISTING" = "true" ]; then
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Debug certificate mismatch"
              exit 1
            fi
          else
            echo "::warning::New debug certificate generated"
            echo "::warning::Firebase SHA-1 may need updating"
            echo "::warning::Older APK may not be updatable"
          fi

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-v1.1-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Release Signing
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE" ] \
            && [ -n "$STORE_PASS" ] \
            && [ -n "$KEY_PASS" ] \
            && [ -n "$KEY_ALIAS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets incomplete"
          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE" \
            | base64 --decode > my-upload-key.jks

          test -s my-upload-key.jks

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /dev/null

          keytool -certreq \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASS" \
            -file /tmp/repair-pro-key-check.csr

          rm -f /tmp/repair-pro-key-check.csr

          echo "Release keystore and key verified"

      - name: Build Signed Release AAB
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ steps.project.outputs.dir }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon bundleRelease --stacktrace --no-configuration-cache
          else
            gradle --no-daemon bundleRelease --stacktrace --no-configuration-cache
          fi

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-v1.1-Release-AAB
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
