
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'Repair-Pro-v1.1-GitHub-Ready.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Repair Pro v1.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Updated Repair Pro Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Repair-Pro-v1.1-GitHub-Ready.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Updated ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f \
            -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::App Gradle file missing"
            exit 1
          fi

          PROJECT="$(cd "$PROJECT" && pwd)"

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not configured"
            exit 1
          fi

          echo "Android SDK found"

      - name: Restore Firebase Configuration
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
              | base64 --decode > app/google-services.json
          fi

          if [ ! -s app/google-services.json ]; then
            echo "::error::Missing Firebase configuration"
            echo "Set GOOGLE_SERVICES_JSON_BASE64 secret"
            exit 1
          fi

          python3 -m json.tool app/google-services.json \
            > /dev/null

      - name: Restore Existing Debug Signing Key
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Existing debug keystore missing"
            echo "Set DEBUG_KEYSTORE_BASE64 secret"
            exit 1
          fi

          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > debug.keystore

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            > /dev/null

      - name: Verify Existing Signing Certificate
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          EXPECTED="237974DA7AFECAEA0E6A6EB8F1E084E58DBBAAB0"

          ACTUAL="$(keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | grep 'SHA1:' \
            | head -1 \
            | cut -d ':' -f 2- \
            | tr -d ' :\r\n' \
            | tr '[:lower:]' '[:upper:]')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing key does not match old APK"
            exit 1
          fi

          echo "Old APK signing certificate verified"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-v1.1-Update-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Release Signing Secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$STORE_PASSWORD" ] &&
             [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured"
          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > my-upload-key.jks

          test -s my-upload-key.jks

      - name: Build Release AAB
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon bundleRelease
          else
            gradle --no-daemon bundleRelease
          fi

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-v1.1-Release-AAB
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
