
name: Build Repair Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "**/*.zip"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/*.kt"
      - "**/*.java"
      - "**/*.xml"
      - "**/gradle.properties"

permissions:
  contents: read

concurrency:
  group: repair-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Repair Pro 2.x
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          extracted = root / "_repair_extracted"
          extracted.mkdir(exist_ok=True)

          def find_project(base):
              for settings in sorted(
                  list(base.rglob("settings.gradle.kts")) +
                  list(base.rglob("settings.gradle"))
              ):
                  project = settings.parent
                  if (
                      (project / "app/build.gradle.kts").is_file()
                      or (project / "app/build.gradle").is_file()
                  ):
                      return project.resolve()
              return None

          project = find_project(root)

          if project is None:
              zips = sorted(
                  root.rglob("*.zip"),
                  key=lambda p: (
                      "repair" not in p.name.lower(),
                      str(p)
                  )
              )

              print("ZIP files found:", len(zips))

              for i, archive in enumerate(zips):
                  if ".git" in archive.parts:
                      continue

                  target = extracted / f"project_{i}"
                  target.mkdir(parents=True, exist_ok=True)

                  print("Checking ZIP:", archive.name)

                  try:
                      with zipfile.ZipFile(archive) as z:
                          for info in z.infolist():
                              dest = (
                                  target / info.filename
                              ).resolve()

                              if not dest.is_relative_to(
                                  target.resolve()
                              ):
                                  raise ValueError(
                                      "Unsafe ZIP path"
                                  )

                          z.extractall(target)

                  except Exception as exc:
                      print("ZIP skipped:", exc)
                      continue

                  project = find_project(target)

                  if project:
                      break

          if project is None:
              raise SystemExit(
                  "::error::Android project not found. "
                  "Upload an Android project ZIP "
                  "containing settings.gradle "
                  "and app/build.gradle."
              )

          print("Android project:", project)

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as output:
              output.write(f"dir={project}\n")
          PY

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "${ANDROID_HOME:?Android SDK missing}"

          echo "Android SDK ready"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ] \
            && [ -f gradle/wrapper/gradle-wrapper.jar ] \
            && [ -f gradle/wrapper/gradle-wrapper.properties ]; then

            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Project Gradle wrapper ready"

          else

            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "Using installed Gradle 8.13"

          fi

      - name: Automatic App Version
        id: version
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          run = int(os.environ["RUN_NUMBER"])

          version_name = f"2.0.{run}"
          version_code = 200000 + run

          candidates = [
              Path("app/build.gradle.kts"),
              Path("app/build.gradle")
          ]

          file = next(
              (p for p in candidates if p.exists()),
              None
          )

          if file is None:
              raise SystemExit(
                  "App Gradle file missing"
              )

          text = file.read_text()

          kotlin = file.suffix == ".kts"

          code_pattern = (
              r"\bversionCode\s*(?:=\s*)?\d+"
          )

          name_pattern = (
              r'\bversionName\s*(?:=\s*)?'
              r'["\'][^"\']*["\']'
          )

          code_replacement = (
              f"versionCode = {version_code}"
              if kotlin
              else f"versionCode {version_code}"
          )

          name_replacement = (
              f'versionName = "{version_name}"'
              if kotlin
              else f'versionName "{version_name}"'
          )

          text, c = re.subn(
              code_pattern,
              code_replacement,
              text,
              count=1
          )

          text, n = re.subn(
              name_pattern,
              name_replacement,
              text,
              count=1
          )

          if c == 0 or n == 0:
              raise SystemExit(
                  "Version fields not found. "
                  "Inspect app/build.gradle."
              )

          file.write_text(text)

          print("App Version:", version_name)
          print("Version Code:", version_code)

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as output:
              output.write(
                  f"name={version_name}\n"
              )
              output.write(
                  f"code={version_code}\n"
              )
          PY

      - name: Restore Firebase Configuration
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" \
              | base64 --decode \
              > app/google-services.json
          fi

          test -s app/google-services.json || {
            echo "::error::Firebase JSON missing"
            exit 1
          }

          python3 -m json.tool \
            app/google-services.json > /dev/null

          echo "Firebase configuration valid"

      - name: Prepare Debug Keystore
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$DEBUG_KEY" ]; then
            printf '%s' "$DEBUG_KEY" \
              | base64 --decode > debug.keystore
          fi

          if [ ! -s debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey > /dev/null

          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"

          echo "Debug keystore ready"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          $GRADLE_CMD \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-${{ steps.version.outputs.name }}-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Release Signing
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE" ] \
            && [ -n "$STORE_PASS" ] \
            && [ -n "$KEY_PASS" ]; then

            echo "ready=true" >> "$GITHUB_OUTPUT"

          else

            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets missing"

          fi

      - name: Restore Release Keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE: ${{ secrets.REPAIR_PRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE" \
            | base64 --decode > my-upload-key.jks

          chmod 600 my-upload-key.jks

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload > /dev/null

          keytool -certreq \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload \
            -keypass "$KEY_PASS" \
            -file /tmp/repair-pro-check.csr

          rm -f /tmp/repair-pro-check.csr

          echo "Release keystore ready"

      - name: Show Release SHA Fingerprints
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          STORE_PASS: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "================================"
          echo "REPAIR PRO RELEASE SHA"
          echo "================================"

          keytool -list -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -alias upload \
            | grep -E 'SHA1:|SHA256:'

          echo "================================"
          echo "Compare these with Firebase"
          echo "================================"

      - name: Build Release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ steps.project.outputs.dir }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.REPAIR_PRO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPAIR_PRO_KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -euo pipefail

          $GRADLE_CMD \
            --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease \
            --stacktrace \
            --no-configuration-cache

      - name: Verify Release APK Signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK" || {
            echo "::error::Release APK missing"
            exit 1
          }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "Release APK signature verified"

      - name: Upload Release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-${{ steps.version.outputs.name }}-Release-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Pro-${{ steps.version.outputs.name }}-Release-AAB
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: success()
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          {
            echo "## Repair Pro Build"
            echo ""
            echo "Version: $VERSION"
            echo ""
            echo "Version Code: $VERSION_CODE"
            echo ""
            echo "Build completed successfully."
            echo ""
            echo "Check Artifacts for APK and AAB."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Signing Files
        if: always() && steps.project.outputs.dir != ''
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -f my-upload-key.jks
          rm -f debug.keystore
          echo "Temporary signing files cleaned"
